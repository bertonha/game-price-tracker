version: 2
updates:
  - package-ecosystem: "npm"
    # Dependabot does not support pnpm natively; keeping "npm" ecosystem with pnpm-lock.yaml present
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Minor and patch updates are bundled into one PR per dependency type.
      # Major updates are left ungrouped so breaking changes get their own PR.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
